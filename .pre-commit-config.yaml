# Pre-commit hooks running the same checks as .github/workflows/code-quality.yml.
# One-time setup after cloning: uv sync && uv run pre-commit install
# All entries go through uv, so they work on Windows and GNU/Linux alike, and use
# the tool versions pinned in uv.lock, like CI.
repos:
  - repo: local
    hooks:
      - id: spdx-headers
        name: SPDX headers
        entry: uv run --script dev-scripts/spdx_headers.py
        language: system
        types: [text]
      - id: ruff-check
        name: ruff check
        entry: uv run --only-group lint ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --only-group lint ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pyright
        name: pyright
        entry: uv run pyright --project .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: typos
        name: typos
        entry: uv run --only-group lint typos --force-exclude
        language: system
        require_serial: true
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false
