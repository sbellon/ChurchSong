name: Python Code Quality
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UV_LOCKED: 1
# The job names are required status checks in the repository ruleset, so renaming
# or merging jobs needs a matching change there. Only `typing` and `testing` run
# on Windows: pyright analyses the `sys.platform == 'win32'` branches only there,
# and some tests only run there. Everything else is platform independent, and
# Linux runners check out and set up considerably faster.
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check lockfile
        run: uv lock --check
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run ruff check
        run: uvx ruff check .
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run ruff format
        run: uvx ruff format --check .
  typing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run pyright
        run: uvx pyright --project .
  testing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run pytest
        run: uv run pytest
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run typos
        run: uvx typos --force-exclude
  # Kept as the final gate: it is the only required check that depends on `testing`
  # and `typos`, so dropping `needs` also means requiring those two in the ruleset.
  build:
    runs-on: ubuntu-latest
    needs: [lockfile, linting, formatting, typing, testing, typos]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run build
        run: uv build
