name: Upload Python Package

# Publishing a GitHub release (tag `v<version>`) builds the sdist and the wheel
# and publishes them on PyPI (`ChurchSong`). Files already on PyPI are skipped,
# so a failed run can simply be re-run. Starting the workflow by hand only
# builds, to try the release build.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  release-build:
    # A pure Python wheel, the same on every platform; Linux runners set up faster.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: ./.github/actions/setup

      - name: Check that the release tag matches the version in pyproject.toml
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi

      - name: Build release distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    # Only `v*` tags may deploy to this environment, and only after approval.
    environment:
      name: pypi
      url: https://pypi.org/project/ChurchSong

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # Files already on PyPI are skipped, so a failed run can simply be re-run.
          skip-existing: true
