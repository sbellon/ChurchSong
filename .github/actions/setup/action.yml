runs:
  using: composite
  steps:
    - name: "Set up Python"
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"

    - name: "Install uv"
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

