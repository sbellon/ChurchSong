name: Set up Python and uv
description: Install the Python version required by pyproject.toml and uv.
runs:
  using: composite
  steps:
    - name: "Set up Python"
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"

    - name: "Install uv"
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        # The wheels download in about a second, which is less than a cache round trip.
        enable-cache: false
