name: Set up uv
description: Install uv, which provides the Python version required by pyproject.toml.
runs:
  using: composite
  steps:
    - name: "Install uv"
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # The wheels download in about a second, which is less than a cache round trip.
        enable-cache: false

    # Like `resources/install.ps1` for the users: only uv's own Python builds, which
    # uv downloads on first use, never one installed on the runner.
    - name: "Use uv-managed Python only"
      shell: bash
      run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
