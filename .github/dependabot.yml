version: 2
updates:
  # `/` covers the workflows in `.github/workflows`, but not a composite action
  # in a subdirectory, so the one holding the `setup-uv` pin is listed as well.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    # A fixed time: without `day` and `time`, Dependabot runs at a time of
    # its own choosing, not necessarily once a week on the same day.
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Berlin
    # New releases of the actions (which run with the workflows' permissions)
    # are only proposed after a week, when a hijacked one has usually been
    # noticed and pulled. The project's own dependencies have no cooldown set,
    # but Dependabot still holds back their new releases for about three days;
    # only security updates arrive right away.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    assignees:
      - sbellon
    # One pull request for all pending updates instead of one per action.
    groups:
      actions:
        patterns:
          - "*"

  # Dependabot runs uv itself: it updates `uv.lock` (and `pyproject.toml` only
  # where a new release falls outside the declared range), so `uv lock --check`
  # in CI keeps passing. Covers `dependencies` and the `dependency-groups`, and
  # with `all` also their transitive dependencies, like `uv lock --upgrade`.
  - package-ecosystem: uv
    directory: /
    # Without it, Dependabot raises every lower bound in `pyproject.toml` to the
    # version it updates to, although ChurchSong does not need that version.
    # It does not take effect yet: for uv, the option never reaches the update
    # job, which still raises the lower bounds, so they have to be put back by
    # hand. See dependabot/dependabot-core#16112 and
    # dependabot/dependabot-core#14908.
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: deps
    assignees:
      - sbellon
    # `uv-build` (the build backend in `[build-system]`) is not locked in
    # `uv.lock`, so while a new release fits the declared range there is
    # nothing to change, and Dependabot then drops the whole group update.
    # On its own it still gets a pull request once a release falls outside
    # the range.
    groups:
      python:
        patterns:
          - "*"
        exclude-patterns:
          - uv-build
