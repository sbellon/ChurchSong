version: 2
updates:
  # `/` covers the workflows in `.github/workflows`, but not a composite action
  # in a subdirectory, so the one holding the `setup-uv` pin is listed as well.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    # A fixed time: without `day` and `time`, Dependabot runs at a time of
    # its own choosing, not necessarily once a week on the same day.
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Berlin
    # New releases of the actions (which run with the workflows' permissions)
    # are only proposed after a week, when a hijacked one has usually been
    # noticed and pulled. The project's own dependencies have no cooldown, so
    # their fixes arrive right away.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    assignees:
      - sbellon
    # One pull request for all pending updates instead of one per action.
    groups:
      actions:
        patterns:
          - "*"

  # Dependabot runs uv itself: it updates `uv.lock` (and `pyproject.toml` only
  # where a new release falls outside the declared range), so `uv lock --check`
  # in CI keeps passing. Covers `dependencies` and the `dependency-groups`, and
  # with `all` also their transitive dependencies, like `uv lock --upgrade`.
  - package-ecosystem: uv
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: deps
    assignees:
      - sbellon
    groups:
      python:
        patterns:
          - "*"
