[project]
name = "ChurchSong"
version = "0.14.1"
authors = [{ name = "Stefan Bellon" }]
description = "Download the event agenda from ChurchTools and instantiate a PowerPoint slide template with the names and portraits of service staff as well as song database verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "packaging>=25.0",
    "platformdirs>=4.3.6",
    "polib>=1.2.0",
    "prettytable>=3.12.0",
    "psutil>=6.1.0; sys_platform == 'win32'",
    "pydantic>=2.9.2",
    "pypdf>=6.1.1",
    "python-pptx>=1.0.2",
    "reportlab>=4.4.4",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "textual>=3.0.1",
    "typer>=0.15.4",
    "tzlocal>=5.3.1",
    "urllib3>=2.0",
    "xlsxwriter>=3.2.3",
]

[project.urls]
Repository = "https://github.com/sbellon/ChurchSong"
Changelog = "https://github.com/sbellon/ChurchSong/blob/main/CHANGELOG.md"

[project.scripts]
ChurchSong = "churchsong.__main__:main"

[dependency-groups]
dev = ["babel>=2.17.0", "pre-commit>=4.0"]
lint = ["pyright>=1.1.400", "ruff>=0.11.9", "typos>=1.51.1"]
test = ["pytest>=8.4", "responses>=0.25.8"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = ["dev", "lint", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
ignore = ["**/__pycache__"]

[tool.ruff]
line-length = 88
builtins = ["_"]

[tool.ruff.lint]
select = ["ALL"]

fixable = [
    "I", # isort
]

ignore = [
    "D",      # docstring
    "COM812", # missing-trailing-comma
    "S603",   # subprocess-without-shell-equals-true
    "FBT001", # boolean-type-hint-positional-argument
    "FBT002", # boolean-default-value-positional-argument
    "TRY400", # error-instead-of-exception
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is the whole point of tests
    "S105",    # tests do compare against hardcoded dummy tokens
    "S106",    # tests do pass hardcoded dummy tokens
    "PLR2004", # magic-value comparisons against literal expectations are fine here
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)SPDX-FileCopyrightText:"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `@validator` decorator to trigger class method treatment.
classmethod-decorators = [
    "classmethod",
    "pydantic.validator",
    "pydantic.root_validator",
]

[tool.typos.default.extend-words]
# Package name of the CA bundle, not a typo of "certify" (newer typos
# dictionaries flag it).
certifi = "certifi"

[tool.typos.default]
extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*typos:\\s*disable$",
    "(?s)(#|//)\\s*typos:\\s*off.*?\\n\\s*(#|//)\\s*typos:\\s*on",
]

[tool.typos.type.po]
extend-glob = ["*.po"]
check-file = false

# Release version bumps: `uvx bump-my-version bump patch|minor|major`.
[tool.bumpversion]
current_version = "0.14.1"
commit = true
pre_commit_hooks = ["uv sync", "git add uv.lock"]

# Only the project's own version, at the start of a line, not a dependency
# that happens to have the same version.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## Unreleased"
replace = """## Unreleased

## {new_version} ({now:%Y-%m-%d})"""
